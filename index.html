<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerenciador de Tarefas e Agenda</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --accent-color: #2196f3;
      --border-radius: 12px;
      --shadow: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Cabeçalho Superior */
    header {
      background: #ffffff;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e0e0e0;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .menu-btn, .gear-btn {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #555;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 8px;
      transition: background 0.2s;
    }

    .menu-btn:hover, .gear-btn:hover {
      background: #f0f0f0;
    }

    h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Sidebar / Menu Lateral */
    .sidebar {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #ffffff;
      box-shadow: 2px 0 10px rgba(0,0,0,0.1);
      transition: left 0.3s ease;
      z-index: 200;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .sidebar.open {
      left: 0;
    }

    .sidebar-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.3);
      display: none;
      z-index: 150;
    }

    .sidebar-overlay.active {
      display: block;
    }

    .sidebar-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar-menu li {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.2s;
    }

    .sidebar-menu li:hover, .sidebar-menu li.active {
      background: #e3f2fd;
      color: var(--accent-color);
    }

    /* Menu da Engrenagem Modal */
    .gear-menu {
      position: absolute;
      top: 60px;
      right: 20px;
      background: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      border: 1px solid #e0e0e0;
      display: none;
      flex-direction: column;
      width: 220px;
      z-index: 101;
      overflow: hidden;
    }

    .gear-menu.active {
      display: flex;
    }

    .gear-menu button {
      padding: 12px 16px;
      border: none;
      background: none;
      text-align: left;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gear-menu button:hover {
      background: #f5f5f5;
    }

    /* Áreas de Conteúdo Principal */
    main {
      padding: 20px;
      flex: 1;
      /* Ajuste de escala para simular visão padrão em 80% no desktop */
      transform: scale(0.92);
      transform-origin: top center;
    }

    .page {
      display: none;
    }

    .page.active {
      display: block;
    }

    /* Grid do Quadro Kanban / Cards */
    .kanban-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      align-items: start;
    }

    /* Modo Mobile Forçado ou Responsivo Natural */
    body.mobile-mode .kanban-grid,
    @media (max-width: 768px) {
      main {
        transform: none; /* Desativa a escala no celular */
        padding: 10px;
      }
      .kanban-grid {
        grid-template-columns: repeat(2, 1fr) !important; /* 02 em 02 bloquinhos */
        gap: 10px;
      }
    }

    /* Card de Cliente */
    .card {
      background: var(--card-bg);
      border-radius: var(--border-radius);
      padding: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }

    .card.status-faturar { background-color: #ffffff; }
    .card.status-faturado { background-color: #fffde7; border-color: #ffe082; }
    .card.status-entrega { background-color: #ffebee; border-color: #ffcdd2; }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .card-title {
      font-weight: 700;
      font-size: 1rem;
    }

    .card-sub {
      font-size: 0.8rem;
      color: #666;
    }

    .badge {
      font-size: 0.7rem;
      padding: 3px 6px;
      border-radius: 4px;
      border: 1px solid #ccc;
      background: #fff;
    }

    .task-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 6px;
    }

    .task-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255,255,255,0.7);
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 0.82rem;
      border: 1px solid #eee;
    }

    .btn-add-task {
      margin-top: 8px;
      background: #ffffff;
      border: 1px dashed #cccccc;
      border-radius: 8px;
      padding: 8px;
      cursor: pointer;
      text-align: center;
      font-size: 0.85rem;
      color: #555;
    }

    .btn-add-task:hover {
      background: #f9f9f9;
    }

    /* Página: Agenda do Dia */
    .agenda-container {
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      padding: 20px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
    }

    .agenda-form {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .agenda-form input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .agenda-form button {
      padding: 10px 16px;
      background: var(--accent-color);
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .agenda-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .agenda-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      background: #f9f9f9;
      border-radius: 6px;
      border-left: 4px solid var(--accent-color);
    }

    .agenda-item.done {
      text-decoration: line-through;
      opacity: 0.6;
      border-left-color: #4caf50;
    }

    /* Formatação para Impressão / PDF */
    @media print {
      header, .sidebar, .gear-menu, .btn-add-task, .agenda-form {
        display: none !important;
      }
      main {
        transform: none !important;
        padding: 0 !important;
      }
      .kanban-grid {
        grid-template-columns: repeat(3, 1fr) !important;
      }
    }
  </style>
</head>
<body>

  <!-- Cabeçalho -->
  <header>
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <h1 id="page-title">Quadro de Clientes</h1>
    </div>
    <button class="gear-btn" onclick="toggleGearMenu()">⚙</button>

    <!-- Menu Dropdown da Engrenagem -->
    <div class="gear-menu" id="gearMenu">
      <button onclick="exportToPDF()">📄 Baixar PDF</button>
      <button onclick="toggleMobileView()">📱 Alternar Layout Mobile</button>
    </div>
  </header>

  <!-- Overlay e Menu Lateral -->
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar">
    <h2>Navegação</h2>
    <ul class="sidebar-menu">
      <li id="menu-quadro" class="active" onclick="switchPage('quadro', 'Quadro de Clientes')">
        📋 Quadro de Clientes
      </li>
      <li id="menu-agenda" onclick="switchPage('agenda', 'Agenda do Dia')">
        📅 Agenda do Dia
      </li>
    </ul>
  </div>

  <!-- Conteúdo Principal -->
  <main>
    <!-- Página 1: Quadro Kanban -->
    <div id="page-quadro" class="page active">
      <div class="kanban-grid" id="kanbanGrid">
        <!-- Exemplo de Card -->
        <div class="card status-faturar">
          <div class="card-header">
            <div>
              <div class="card-title">Francisco Morais</div>
              <div class="card-sub">Mobi Like (Cat 36)</div>
            </div>
            <span class="badge">Faturar</span>
          </div>
          <div class="card-sub">Criado: 27/07/2026</div>
          <div class="task-list">
            <div class="task-item">🟡 Faturamento de fábrica</div>
          </div>
          <button class="btn-add-task">+ Adicionar Tarefa</button>
        </div>

        <div class="card status-faturado">
          <div class="card-header">
            <div>
              <div class="card-title">Geni Carmen</div>
              <div class="card-sub">Argo Drive</div>
            </div>
            <span class="badge">Faturar</span>
          </div>
          <div class="card-sub">Criado: 27/07/2026</div>
          <div class="task-list">
            <div class="task-item">🟡 Pagamento do Banco</div>
            <div class="task-item">🟡 Emplacamento</div>
          </div>
          <button class="btn-add-task">+ Adicionar Tarefa</button>
        </div>
      </div>
    </div>

    <!-- Página 2: Agenda do Dia -->
    <div id="page-agenda" class="page">
      <div class="agenda-container">
        <h2>Tarefas do Dia</h2>
        <br>
        <form class="agenda-form" onsubmit="addAgendaItem(event)">
          <input type="text" id="agendaInput" placeholder="Digite uma tarefa para hoje..." required>
          <button type="submit">Adicionar</button>
        </form>

        <ul class="agenda-list" id="agendaList">
          <!-- Tarefas da agenda serão inseridas aqui -->
        </ul>
      </div>
    </div>
  </main>

  <script>
    // Controle do Menu Lateral
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('active');
    }

    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('active');
    }

    // Controle da Engrenagem
    function toggleGearMenu() {
      document.getElementById('gearMenu').classList.toggle('active');
    }

    // Troca de Páginas via Submenu
    function switchPage(pageId, title) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.sidebar-menu li').forEach(m => m.classList.remove('active'));

      document.getElementById(`page-${pageId}`).classList.add('active');
      document.getElementById(`menu-${pageId}`).classList.add('active');
      document.getElementById('page-title').innerText = title;

      closeSidebar();
    }

    // Alternar Layout Mobile
    function toggleMobileView() {
      document.body.classList.toggle('mobile-mode');
      toggleGearMenu();
    }

    // Baixar Tela Ativa em PDF
    function exportToPDF() {
      toggleGearMenu();
      window.print();
    }

    // Lógica da Agenda do Dia
    function addAgendaItem(event) {
      event.preventDefault();
      const input = document.getElementById('agendaInput');
      const text = input.value.trim();
      if (!text) return;

      const li = document.createElement('li');
      li.className = 'agenda-item';
      li.innerHTML = `
        <span onclick="toggleTask(this)" style="cursor:pointer;">${text}</span>
        <button onclick="this.parentElement.remove()" style="background:none;border:none;color:red;cursor:pointer;">✕</button>
      `;

      document.getElementById('agendaList').appendChild(li);
      input.value = '';
    }

    function toggleTask(element) {
      element.parentElement.classList.toggle('done');
    }
  </script>
</body>
</html>
